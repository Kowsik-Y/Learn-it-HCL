name: Deploy Backend to Azure

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:  # Allow manual triggers

env:
  RESOURCE_GROUP: rg-learnit-prod-india
  ACR_NAME: ${{ secrets.ACR_NAME }}
  ACA_APP: ca-learnit-backend
  IMAGE_NAME: backend

jobs:
  build-and-deploy:
    name: Build & Deploy Backend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build & Push image to ACR
        run: |
          TARGET_ACR=$(az acr list --resource-group $RESOURCE_GROUP --query "[0].name" -o tsv)
          echo "Using ACR: $TARGET_ACR"
          az acr build \
            --registry "$TARGET_ACR" \
            --image "$IMAGE_NAME:latest" \
            --image "$IMAGE_NAME:${{ github.sha }}" \
            ./backend

      - name: Deploy to Azure Container Apps
        run: |
          ACR_SERVER=$(az acr list --resource-group $RESOURCE_GROUP --query "[0].loginServer" -o tsv)
          az containerapp update \
            --name "$ACA_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "${ACR_SERVER}/$IMAGE_NAME:${{ github.sha }}" \
            -o none

      - name: Wait for deployment and check health
        run: |
          echo "Waiting 30s for container and SSL to initialize..."
          sleep 30
          FQDN=$(az containerapp show \
            --name "$ACA_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)
          echo "Backend URL: https://$FQDN"
          
          for i in {1..6}; do
            if curl -s -f --max-time 10 "https://$FQDN/health"; then
              echo ""
              echo "✅ Backend health check passed!"
              break
            fi
            echo "Waiting for container endpoint (attempt $i/6)..."
            sleep 15
          done

      - name: Print Backend URL
        run: |
          FQDN=$(az containerapp show \
            --name $ACA_APP \
            --resource-group $RESOURCE_GROUP \
            --query properties.configuration.ingress.fqdn \
            --output tsv)
          echo "🚀 Backend deployed: https://$FQDN"
          echo "📖 Swagger docs: https://$FQDN/docs"
